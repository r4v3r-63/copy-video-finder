name: Проверка кода

# Ruff и тесты на каждый пуш в main и на запросы на слияние.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Системные библиотеки Qt и FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libpulse0 libglib2.0-0

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests scripts

      - name: Тесты
        run: pytest -q

      - name: Загрузка по ссылке — локальная выдача и исходный файл
        run: python scripts/check_stock_link.py

      - name: Скачивание со страницы без внешней сети
        run: python scripts/check_site_download.py

      - name: Встроенный просмотр локального видео
        run: python scripts/check_site_player.py

  site-player:
    name: Встроенный просмотр Windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Переносимый Deno с проверкой SHA-256
        shell: pwsh
        run: ./scripts/prepare_deno.ps1
      - name: Загрузка по ссылке — локальная выдача и исходный файл
        run: python scripts/check_stock_link.py

      - name: Скачивание со страницы без внешней сети
        run: python scripts/check_site_download.py
      - name: Переносимый WebView2 с проверкой подписи Microsoft
        shell: pwsh
        run: ./scripts/prepare_webview2.ps1
      - name: Воспроизведение H.264 внутри окна без сети
        run: python scripts/check_site_player.py
      - name: Сборка и проверка встроенного плеера в EXE
        shell: pwsh
        run: |
          pyinstaller build.spec --noconfirm
          if ($LASTEXITCODE -ne 0) { throw "Ошибка сборки программы." }
          Copy-Item app/deno dist/CopyVideoFinder/deno -Recurse
          Copy-Item app/webview2 dist/CopyVideoFinder/webview2 -Recurse
          $fixture = (Resolve-Path tests/fixtures/site_player).Path
          $p = Start-Process dist/CopyVideoFinder/CopyVideoFinder.exe -ArgumentList @("--check-site-player", ('"{0}"' -f $fixture)) -PassThru
          $done = $p.WaitForExit(90000)
          if (-not $done) { Stop-Process -Id $p.Id -Force }
          if (-not $done -or $p.ExitCode -ne 0) {
            if (Test-Path dist/CopyVideoFinder/Данные/app.log) {
              Get-Content dist/CopyVideoFinder/Данные/app.log -Tail 20 | ForEach-Object { Write-Host "::error::$_" }
            }
            throw "Не подтверждено воспроизведение в оконной сборке."
          }
          $downloads = (Resolve-Path tests/fixtures).Path
          $d = Start-Process dist/CopyVideoFinder/CopyVideoFinder.exe -ArgumentList @("--check-site-download", ('"{0}"' -f $downloads)) -PassThru
          if (-not $d.WaitForExit(90000)) { Stop-Process -Id $d.Id -Force; throw "Загрузчик не завершился." }
          if ($d.ExitCode -ne 0) {
            Get-Content dist/CopyVideoFinder/Данные/app.log -Tail 20 | ForEach-Object { Write-Host "::error::$_" }
            throw "Не подтверждено скачивание в оконной сборке."
          }
          $s = Start-Process dist/CopyVideoFinder/CopyVideoFinder.exe -ArgumentList @("--check-stock-link", ('"{0}"' -f $downloads)) -PassThru
          if (-not $s.WaitForExit(90000)) { Stop-Process -Id $s.Id -Force; throw "Новая вкладка не завершила проверку." }
          if ($s.ExitCode -ne 0) { throw "Не подтверждена загрузка по ссылке в EXE." }
      - uses: actions/upload-artifact@v4
        with:
          name: webview2-runtime
          path: app/webview2/
          retention-days: 1

  release-version:
    name: Проверка новой версии
    needs: [check, site-player]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сравнение версий до и после пуша
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BUILD_SHA: ${{ github.sha }}
        run: python scripts/release_version.py

  release:
    name: Выпуск новой версии
    needs: release-version
    if: needs.release-version.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.release-version.outputs.version }}
      ref: ${{ github.sha }}
    secrets: inherit
