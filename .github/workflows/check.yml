name: Проверка кода

# Ruff и тесты на каждый пуш в main и на запросы на слияние.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Системные библиотеки Qt и FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libpulse0 libglib2.0-0

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests scripts

      - name: Тесты
        run: pytest -q

      - name: Встроенный просмотр локального видео
        run: python scripts/check_site_player.py

  site-player:
    name: Встроенный просмотр Windows
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Зависимости
        run: pip install -r requirements-dev.txt
      - name: Переносимый WebView2 с проверкой подписи Microsoft
        shell: pwsh
        run: ./scripts/prepare_webview2.ps1
      - name: Воспроизведение H.264 внутри окна без сети
        run: python scripts/check_site_player.py
      - uses: actions/upload-artifact@v4
        with:
          name: webview2-runtime
          path: app/webview2/
          retention-days: 1

  release-version:
    name: Проверка новой версии
    needs: [check, site-player]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !github.event.deleted
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Сравнение версий до и после пуша
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BUILD_SHA: ${{ github.sha }}
        run: python scripts/release_version.py

  release:
    name: Выпуск новой версии
    needs: release-version
    if: needs.release-version.outputs.version != ''
    permissions:
      contents: write
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ needs.release-version.outputs.version }}
      ref: ${{ github.sha }}
    secrets: inherit
