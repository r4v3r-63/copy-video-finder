name: Проверка кода

# Ruff и тесты на каждый пуш в main и на запросы на слияние.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Системные библиотеки Qt и FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 \
            libdbus-1-3 libpulse0 libglib2.0-0

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check app tests

      - name: Тесты
        run: pytest -q
