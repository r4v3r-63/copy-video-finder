name: Порядок в выпусках

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-releases.yml
      - scripts/maintain_releases.py
      - docs/release-notes/**
  workflow_run:
    workflows: [Проверка кода, Сборка для Windows]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "27 5 * * 1"
  workflow_dispatch:
    inputs:
      keep:
        description: Сколько последних выпусков оставить
        default: "3"
        required: true
      dry_run:
        description: Только показать план
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-maintenance
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # workflow_run использует только доверенный код основной ветки, без артефактов запуска.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Описания и три последних выпуска
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ inputs.keep || '3' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
        run: |
          args=(--keep "$KEEP")
          if [ "$DRY_RUN" = true ]; then args+=(--dry-run); fi
          python scripts/maintain_releases.py "${args[@]}"
