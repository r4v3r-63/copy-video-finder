name: Сборка для Windows

# Ручной запуск без версии собирает ZIP как артефакт.
# Ручной запуск с версией (например, 0.4.0) или тег v* — ещё и публикует ZIP в Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для выпуска в Releases, например 0.4.0 (пусто — только собрать)"
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.inputs.version != '' && format('v{0}', github.event.inputs.version) || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -r requirements.txt pyinstaller==6.11.1

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Сборка PyInstaller (onedir)
        run: pyinstaller build.spec --noconfirm

      - name: FFmpeg в папку программы
        shell: pwsh
        run: |
          # FFmpeg 7.1.1 essentials (gyan.dev), версия и контрольная сумма закреплены.
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip"
          $sha256 = "04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) { throw "Контрольная сумма FFmpeg не совпала: $actual" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $root = "ffmpeg-tmp/ffmpeg-7.1.1-essentials_build"
          $target = "dist/CopyVideoFinder/ffmpeg"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item "$root/bin/ffmpeg.exe", "$root/bin/ffprobe.exe" $target
          Copy-Item "$root/LICENSE" "$target/LICENSE.txt"

      - name: Проверка запуска
        shell: pwsh
        run: |
          $p = Start-Process dist/CopyVideoFinder/CopyVideoFinder.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Программа завершилась сразу после запуска (код $($p.ExitCode))" }
          Stop-Process -Id $p.Id
          Wait-Process -Id $p.Id -Timeout 30 -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not (Test-Path "dist/CopyVideoFinder/Данные/app.log")) { throw "Не создана папка Данные" }
          Get-Content "dist/CopyVideoFinder/Данные/app.log"
          Remove-Item -Recurse -Force "dist/CopyVideoFinder/Данные"

      - name: ZIP
        shell: pwsh
        run: |
          $name = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "${{ github.ref_name }}-${{ github.run_number }}" }
          Compress-Archive -Path dist/CopyVideoFinder -DestinationPath "CopyVideoFinder-$name-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CopyVideoFinder-windows
          path: CopyVideoFinder-*.zip

      - name: Публикация в Releases
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Поиск видео Copy.ru ${{ env.RELEASE_TAG }}
          files: CopyVideoFinder-*.zip
