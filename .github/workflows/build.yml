name: Сборка для Windows

# После успешной проверки main новая версия выпускается автоматически.
# Ручной запуск без версии собирает ZIP как артефакт.
# Ручной запуск с версией (например, 0.4.0) или тег v* — ещё и публикует ZIP в Releases.
on:
  workflow_call:
    inputs:
      version:
        description: "Новая версия после успешного CI"
        required: true
        type: string
      ref:
        description: "Точный SHA проверенного коммита"
        required: true
        type: string
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Версия для выпуска в Releases, например 0.4.0 (пусто — только собрать)"
        required: false
        default: ""

permissions:
  contents: write

# Ручной и автоматический запуск одной версии выполняются последовательно.
concurrency:
  group: windows-${{ inputs.version != '' && format('v{0}', inputs.version) || (startsWith(github.ref, 'refs/tags/') && github.ref_name || github.ref) }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  RELEASE_TAG: ${{ inputs.version != '' && format('v{0}', inputs.version) || (startsWith(github.ref, 'refs/tags/') && github.ref_name || '') }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Версия выпуска совпадает с __version__
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: |
          # Иначе программа будет без конца предлагать «обновиться» до той же версии.
          $m = Select-String -Path app/__init__.py -Pattern '__version__\s*=\s*"([^"]+)"'
          $code = $m.Matches[0].Groups[1].Value
          if ("v$code" -ne $env:RELEASE_TAG) { throw "Тег $env:RELEASE_TAG не совпадает с __version__ = $code в app/__init__.py" }
          git show-ref --verify --quiet "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -eq 0) {
            $tag = git rev-list -n 1 $env:RELEASE_TAG
            if ($tag -ne (git rev-parse HEAD)) {
              throw "Тег $env:RELEASE_TAG уже указывает на другой коммит"
            }
          }
          # Отсутствующий тег — нормальный случай перед первым выпуском.
          $global:LASTEXITCODE = 0

      - name: Защита опубликованного выпуска
        if: env.RELEASE_TAG != ''
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                ...context.repo, tag: process.env.RELEASE_TAG,
              });
            } catch (error) {
              if (error.status === 404) return;
              throw error;
            }
            core.setFailed(`Выпуск ${process.env.RELEASE_TAG} уже существует. Для изменений повысьте версию.`);

      - name: Зависимости
        run: pip install -r requirements-dev.txt

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Сборка PyInstaller (onedir)
        run: pyinstaller build.spec --noconfirm

      - name: Переносимый Deno с проверкой SHA-256
        shell: pwsh
        run: ./scripts/prepare_deno.ps1 -Destination dist/CopyVideoFinder/deno

      - name: FFmpeg в папку программы
        shell: pwsh
        run: |
          # FFmpeg 7.1.1 essentials (gyan.dev), версия и контрольная сумма закреплены.
          $url = "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip"
          $sha256 = "04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          $actual = (Get-FileHash ffmpeg.zip -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $sha256) { throw "Контрольная сумма FFmpeg не совпала: $actual" }
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $root = "ffmpeg-tmp/ffmpeg-7.1.1-essentials_build"
          $target = "dist/CopyVideoFinder/ffmpeg"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item "$root/bin/ffmpeg.exe", "$root/bin/ffprobe.exe" $target
          Copy-Item "$root/LICENSE" "$target/LICENSE.txt"

      - name: Переносимый WebView2 из проверки
        id: webview-runtime
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: webview2-runtime
          path: dist/CopyVideoFinder/webview2

      - name: Переносимый WebView2 при ручной сборке
        if: steps.webview-runtime.outcome != 'success'
        shell: pwsh
        run: ./scripts/prepare_webview2.ps1 -Destination dist/CopyVideoFinder/webview2

      - name: Встроенные ключи API из секретов репозитория
        shell: pwsh
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
          COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: |
          # Ключи не хранятся в коде: они берутся из Settings → Secrets репозитория.
          $keys = [ordered]@{}
          if ($env:PIXABAY_API_KEY) { $keys.pixabay_api_key = $env:PIXABAY_API_KEY }
          if ($env:VIMEO_TOKEN) { $keys.vimeo_token = $env:VIMEO_TOKEN }
          if ($env:COVERR_API_KEY) { $keys.coverr_api_key = $env:COVERR_API_KEY }
          if ($env:PEXELS_API_KEY) { $keys.pexels_api_key = $env:PEXELS_API_KEY }
          if ($env:EUROPEANA_API_KEY) { $keys.europeana_api_key = $env:EUROPEANA_API_KEY }
          if ($env:BRAVE_API_KEY) { $keys.brave_api_key = $env:BRAVE_API_KEY }
          if ($env:TAVILY_API_KEY) { $keys.tavily_api_key = $env:TAVILY_API_KEY }
          [IO.File]::WriteAllText("dist/CopyVideoFinder/defaults.json", ($keys | ConvertTo-Json))
          Write-Host "Встроено ключей: $($keys.Count) ($($keys.Keys -join ', '))"

      - name: Проверка запуска
        shell: pwsh
        run: |
          $p = Start-Process dist/CopyVideoFinder/CopyVideoFinder.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Программа завершилась сразу после запуска (код $($p.ExitCode))" }
          Stop-Process -Id $p.Id
          Wait-Process -Id $p.Id -Timeout 30 -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          if (-not (Test-Path "dist/CopyVideoFinder/Данные/app.log")) { throw "Не создана папка Данные" }
          Get-Content "dist/CopyVideoFinder/Данные/app.log"
          Remove-Item -Recurse -Force "dist/CopyVideoFinder/Данные"

      - name: Воспроизведение H.264 в собранной программе
        shell: pwsh
        run: |
          $fixture = (Resolve-Path tests/fixtures/site_player).Path
          $p = Start-Process dist/CopyVideoFinder/CopyVideoFinder.exe -ArgumentList @("--check-site-player", ('"{0}"' -f $fixture)) -PassThru
          if (-not $p.WaitForExit(90000)) {
            Stop-Process -Id $p.Id -Force
            Get-Content dist/CopyVideoFinder/Данные/app.log -Tail 20 | ForEach-Object { Write-Host "::error::$_" }
            throw "Встроенный просмотр не завершил проверку."
          }
          if ($p.ExitCode -ne 0) { Get-Content dist/CopyVideoFinder/Данные/app.log; throw "Не подтверждено воспроизведение H.264." }
          Start-Sleep -Seconds 2
          Remove-Item -Recurse -Force dist/CopyVideoFinder/Данные

      - name: Скачивание со страницы в собранной программе
        shell: pwsh
        run: |
          $fixture = (Resolve-Path tests/fixtures).Path
          $p = Start-Process dist/CopyVideoFinder/CopyVideoFinder.exe -ArgumentList @("--check-site-download", ('"{0}"' -f $fixture)) -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "Загрузчик не завершился." }
          if ($p.ExitCode -ne 0) { Get-Content dist/CopyVideoFinder/Данные/app.log; throw "Не подтверждено скачивание." }
          Remove-Item -Recurse -Force dist/CopyVideoFinder/Данные

      - name: Загрузка по ссылке в собранном EXE
        shell: pwsh
        run: |
          $fixture = (Resolve-Path tests/fixtures).Path
          $p = Start-Process dist/CopyVideoFinder/CopyVideoFinder.exe -ArgumentList @("--check-stock-link", ('"{0}"' -f $fixture)) -PassThru
          if (-not $p.WaitForExit(90000)) { Stop-Process -Id $p.Id -Force; throw "Проверка вкладки не завершилась." }
          if ($p.ExitCode -ne 0) { Get-Content dist/CopyVideoFinder/Данные/app.log; throw "Ошибка загрузки по ссылке." }
          Remove-Item -Recurse -Force dist/CopyVideoFinder/Данные

      - name: Реальное автообновление и перезапуск EXE
        run: python scripts/check_updater.py dist/CopyVideoFinder

      - name: ZIP
        shell: pwsh
        run: |
          $name = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { "${{ github.ref_name }}-${{ github.run_number }}" }
          $zip = "CopyVideoFinder-$name-windows.zip"
          Compress-Archive -Path dist/CopyVideoFinder -DestinationPath $zip
          # Контрольная сумма: программа сверяет её при автообновлении.
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$zip.sha256", "$hash  $zip`n")

      - uses: actions/upload-artifact@v4
        with:
          name: CopyVideoFinder-windows
          retention-days: 7
          path: |
            CopyVideoFinder-*.zip
            CopyVideoFinder-*.zip.sha256

      - name: Примечания выпуска на русском
        if: env.RELEASE_TAG != ''
        shell: pwsh
        run: python scripts/maintain_releases.py --notes-for $env:RELEASE_TAG --output release-body.md

      - name: Публикация в Releases
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ inputs.ref || github.sha }}
          name: Поиск видео Copy.ru ${{ env.RELEASE_TAG }}
          body_path: release-body.md
          make_latest: legacy
          fail_on_unmatched_files: true
          files: |
            CopyVideoFinder-*.zip
            CopyVideoFinder-*.zip.sha256
