name: Сборка для Windows

# Ручной запуск собирает ZIP как артефакт; тег v* — ещё и публикует его в Releases.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Зависимости
        run: pip install -r requirements.txt pyinstaller==6.11.1

      - name: Тесты
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Сборка PyInstaller (onedir)
        run: pyinstaller build.spec --noconfirm

      - name: FFmpeg в папку программы
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n7.1-latest-win64-gpl-7.1.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          $bin = (Get-ChildItem ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          $target = "dist/CopyVideoFinder/ffmpeg"
          New-Item -ItemType Directory -Force $target | Out-Null
          Copy-Item "$bin/ffmpeg.exe", "$bin/ffprobe.exe" $target
          $license = Get-ChildItem ffmpeg-tmp -Recurse -Filter LICENSE.txt | Select-Object -First 1
          if ($license) { Copy-Item $license.FullName "$target/LICENSE.txt" }

      - name: Проверка запуска
        shell: pwsh
        run: |
          $p = Start-Process dist/CopyVideoFinder/CopyVideoFinder.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "Программа завершилась сразу после запуска (код $($p.ExitCode))" }
          Stop-Process -Id $p.Id
          if (-not (Test-Path "dist/CopyVideoFinder/Данные/app.log")) { throw "Не создана папка Данные" }
          Get-Content "dist/CopyVideoFinder/Данные/app.log"
          Remove-Item -Recurse -Force "dist/CopyVideoFinder/Данные"

      - name: ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/CopyVideoFinder -DestinationPath "CopyVideoFinder-${{ github.ref_name }}-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CopyVideoFinder-windows
          path: CopyVideoFinder-*.zip

      - name: Публикация в Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: CopyVideoFinder-*.zip
